[project]
name = "bike-my-day"
version = "0.1.0"
description = "bike-my-day API: rides, email-code login, and the nightly forecast push"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "boto3>=1.35",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic[email]>=2.0",
    "pyjwt>=2.9",
    "pywebpush>=2.0",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8",
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
